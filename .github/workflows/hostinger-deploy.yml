# Hostinger deploy for freedom-arena.fr
name: Hostinger Deploy

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/hostinger-deploy.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/hostinger-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run build
      - name: Upload dist to Hostinger
        if: github.event_name != 'pull_request'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ftp.freedom-arena.fr
          username: u700346517.MRIC
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: web/dist/
          server-dir: /home/u700346517/domains/freedom-arena.fr/public_html/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
