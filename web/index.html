<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FreedomArena × RPGQG Cards" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>FreedomArena × RPGQG Cards</title>
  </head>
  <body>
    <div id="root"><div id="startup-status" data-boot="vite" style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#070b13;color:#dce7ff;font-family:system-ui,sans-serif;text-align:center"><div><h1 style="margin:0 0 8px">Freedom Arena</h1><p style="margin:0;opacity:.75">Chargement du jeu…</p></div></div></div>
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (root) root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#070b13;color:#ffd7d7;font-family:system-ui,sans-serif"><div><h1>Freedom Arena — erreur de démarrage</h1><p>' + String(event.error && event.error.message || event.message || 'Erreur JavaScript') + '</p><p style="opacity:.7">Recharge la page après le prochain déploiement.</p></div></div>';
      });
      window.addEventListener('unhandledrejection', function (event) {
        var root = document.getElementById('root');
        if (root) root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#070b13;color:#ffd7d7;font-family:system-ui,sans-serif"><div><h1>Freedom Arena — erreur de démarrage</h1><p>' + String(event.reason && event.reason.message || event.reason || 'Erreur asynchrone') + '</p></div></div>';
      });
    </script>
    <script type="module">
      if (location.hostname === 'localhost' && location.port === '7700') {
        var root = document.getElementById('root');
        if (root) root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:28px;background:#070b13;color:#dce7ff;font-family:system-ui,sans-serif;text-align:center"><div style="max-width:680px"><h1 style="font-size:clamp(30px,7vw,54px);margin:0 0 16px">Freedom Arena</h1><h2 style="color:#ffd7d7">SPCK utilise l’aperçu statique</h2><p>Le jeu doit être lancé avec Vite pour transformer <code>src/main.tsx</code> en JavaScript.</p><pre style="text-align:left;padding:16px;overflow:auto;background:#111827;border-radius:12px">cd web
npm install
npm run spck</pre><p>Ensuite ouvre <strong>http://localhost:5173/</strong> dans l’aperçu SPCK.</p><p style="opacity:.7">Ne lance pas directement <code>web/index.html</code> avec le serveur :7700.</p></div></div>';
      } else {
        import('./src/main.tsx');
      }
    </script>
    <script>
      window.setTimeout(function () {
        if (document.documentElement.dataset.freedomArenaBooted === 'true') return;
        var root = document.getElementById('root');
        if (!root || !document.getElementById('startup-status')) return;
        var url = new URL('./src/main.tsx', document.baseURI).href;
        root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#070b13;color:#ffd7d7;font-family:system-ui,sans-serif;text-align:center"><div><h1>Freedom Arena — module non démarré</h1><p>Le bundle JavaScript n\'a pas terminé son démarrage.</p><p style="opacity:.7;word-break:break-all">Entrée: ' + url + '</p><p style="opacity:.7">Recharge forcée : Ctrl+F5 ou vider le cache du site.</p></div></div>';
      }, 5000);
    </script>
  </body>
</html>
